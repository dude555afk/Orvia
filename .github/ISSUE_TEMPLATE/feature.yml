name: Feature request
description: Suggest an improvement for Orvia.
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the smallest useful solution.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What capability should be added or improved, and who benefits from it?
      placeholder: Describe the problem or missing capability.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: If you already have an implementation idea, describe it here.
      placeholder: Explain how you think this could work.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workarounds or alternative designs you considered.
