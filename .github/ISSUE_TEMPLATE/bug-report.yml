name: Bug report
description: Report a reproducible problem in Orvia.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Orvia. Please include enough detail to reproduce the problem.
  - type: textarea
    id: bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your device, operating system, Orvia version or commit, and relevant model/provider.
      placeholder: |
        Device:
        OS:
        Orvia version/commit:
        Provider/model:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: If applicable, add screenshots or a screen recording that helps explain the problem.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, error messages, or any other information that may help diagnose the issue.
