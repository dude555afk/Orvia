name: Format rootfs test once

on:
  push:
    branches:
      - cleanup/neutral-defaults
    paths:
      - .github/workflows/orvia-format-rootfs-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - run: dart format test/core/services/sandbox/rootfs_source_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add test/core/services/sandbox/rootfs_source_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply Dart formatter to rootfs test'
          git push origin HEAD:cleanup/neutral-defaults
