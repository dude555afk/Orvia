name: Orvia Native UI Preview

on:
  push:
    branches:
      - feature/orvia-lastchat-ui-settings-20261028
    paths:
      - '.github/workflows/orvia-native-ui-preview.yml'
      - 'tool/prepare_orvia_native.py'
      - 'native-v2/catalog/**'
      - 'docs/orvia-logo.png'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Orvia and pinned LastChat source
        uses: actions/checkout@v4
        with:
          ref: feature/orvia-lastchat-ui-settings-20261028
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-v2/lastchat/web-ui/package-lock.json

      - name: Verify pinned source and Orvia catalog
        run: |
          test -f native-v2/lastchat/app/build.gradle.kts
          test -f native-v2/lastchat/gradlew
          test -f native-v2/catalog/lastchat_catalog.json
          test -f docs/orvia-logo.png
          python3 -m json.tool native-v2/catalog/lastchat_catalog.json >/dev/null
          git submodule status

      - name: Apply Orvia identity and settings
        run: python3 tool/prepare_orvia_native.py

      - name: Install bundled web UI dependencies
        working-directory: native-v2/lastchat/web-ui
        run: npm ci

      # A debug APK disables R8 and ships unused bytecode from the full upstream
      # app, which is not representative of an installable phone preview.
      # Build the arm64-only release variant with code/resource shrinking enabled.
      - name: Build optimized native preview APK
        working-directory: native-v2/lastchat
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevRelease --no-daemon --stacktrace --max-workers=2 \
            -Plastchat.abi.splits=false \
            -Plastchat.release.minify=true

      - name: Verify APK and report largest payloads
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find native-v2/lastchat/app/build/outputs/apk/dev/release -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK"
          unzip -t "$APK"
          AAPT="$(command -v aapt || find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -F "package: name='com.dude555afk.orvia.nativev2.dev'" <<< "$BADGING"
          grep -F "application-label:'Orvia'" <<< "$BADGING"
          MANIFEST_DUMP="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          grep -F "com.dude555afk.orvia.nativev2.OrviaApp" <<< "$MANIFEST_DUMP"
          if grep -F "me.rerere.rikkahub.OrviaApp" <<< "$MANIFEST_DUMP"; then
            echo "ERROR: upstream package namespace is still used as the Android entry point."
            exit 1
          fi
          if grep -F "LastChatApp" <<< "$MANIFEST_DUMP"; then
            echo "ERROR: upstream LastChat Application class is still in the APK manifest."
            exit 1
          fi
          if grep -F "REQUEST_INSTALL_PACKAGES" <<< "$MANIFEST_DUMP"; then
            echo "ERROR: unused REQUEST_INSTALL_PACKAGES permission remains in APK."
            exit 1
          fi
          echo "APK identity and sensitive install permission checks passed."
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Built APK: $APK ($(du -h "$APK" | cut -f1))"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          with zipfile.ZipFile(apk) as zf:
              items = sorted(
                  ((info.file_size, info.filename) for info in zf.infolist() if not info.is_dir()),
                  reverse=True,
              )
          print("Largest packaged entries:")
          for size, name in items[:20]:
              print(f"{size / (1024 * 1024):7.2f} MiB  {name}")
          print(f"Total uncompressed payload: {sum(s for s, _ in items) / (1024 * 1024):.2f} MiB")
          PY

      - name: Upload optimized Orvia Native Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: orvia-native-ui-preview-optimized
          path: native-v2/lastchat/app/build/outputs/apk/dev/release/*.apk
          if-no-files-found: error
          retention-days: 14
