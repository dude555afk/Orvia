name: Temporary final formatter

on:
  push:
    branches: [integration/composer-mcp-tts-20261014]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Format failing MCP regression test
        run: |
          set -euo pipefail
          dart format test/features/home/widgets/chat_input_section_capability_scope_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/features/home/widgets/chat_input_section_capability_scope_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(test): format capability regression"
            git push origin HEAD:integration/composer-mcp-tts-20261014
          fi
