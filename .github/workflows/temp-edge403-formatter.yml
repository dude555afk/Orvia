name: Temporary Edge 403 formatter

on:
  push:
    branches: [fix/android-edge-403-fallback-20261014]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Apply Dart formatter to Edge TTS fix
        run: |
          set -euo pipefail
          dart format lib/core/providers/tts_provider.dart lib/core/services/tts/network_tts.dart lib/features/settings/pages/tts_services_page.dart test/core/services/tts/network_tts_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/providers/tts_provider.dart lib/core/services/tts/network_tts.dart lib/features/settings/pages/tts_services_page.dart test/core/services/tts/network_tts_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(tts): format Edge 403 fallback"
            git push origin HEAD:fix/android-edge-403-fallback-20261014
          fi
