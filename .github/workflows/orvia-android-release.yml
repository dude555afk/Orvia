name: Orvia Android Public Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

concurrency:
  group: orvia-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')"
          VERSION_NAME="${APP_VERSION%%+*}"
          RELEASE_TAG="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "Release: ${RELEASE_TAG}"

      - name: Configure Android release signing
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Android release signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          test -s android/app/key.jks
          {
            printf 'storeFile=key.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/key.jks android/key.properties

      - name: Build signed split APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          [ "${#apks[@]}" -gt 0 ]
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
            sha256sum "$apk"
          done

      - name: Verify release APK omits accessibility service
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | head -n 1)"
          if [ -z "$APKANALYZER" ]; then
            echo "::error::apkanalyzer not found"
            exit 1
          fi
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-*-release.apk' | head -n 1)"
          test -n "$APK"
          if "$APKANALYZER" manifest print "$APK" | grep -q 'PhoneControlService'; then
            echo "::error::Public release still exposes PhoneControlService; refusing to publish."
            exit 1
          fi

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi="$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')"
            mv "$file" "Orvia_android_${VERSION_NAME}_${abi}.apk"
          done

      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Orvia ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Orvia_android_*_arm64-v8a.apk
            build/app/outputs/flutter-apk/Orvia_android_*_armeabi-v7a.apk
            build/app/outputs/flutter-apk/Orvia_android_*_x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Orvia-Android-${{ env.VERSION_NAME }}
          path: build/app/outputs/flutter-apk/Orvia_android_*.apk
