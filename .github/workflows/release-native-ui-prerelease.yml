name: Release Orvia 2 Native UI Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-native-ui-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: native-ui-prerelease-v2
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified native UI preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful upstream UI build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN=38616025558
          EXPECTED_SHA=5f9409f73374f427f7bc2b6e02b78db69575d05e
          RUN_SHA="$(gh run view "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          CONCLUSION="$(gh run view "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          test "$RUN_SHA" = "$EXPECTED_SHA"
          test "$CONCLUSION" = success
      - name: Download and validate build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 38616025558 -R "$GITHUB_REPOSITORY" --name orvia-2-lastchat-ui-debug --dir dist
          APK="$(find dist -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" Orvia-2-Native-UI-Preview.apk
          unzip -tq Orvia-2-Native-UI-Preview.apk
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          # Orvia 2.0 Android-native UI preview

          Experimental Android APK built from the full LastChat native
          Jetpack Compose app source, pinned at commit
          b8a2cb52311ea31719f9c20d44f35c5ee8e52f98.

          The preview includes Orvia's temporary launcher branding and a
          separate application ID: com.dude555afk.orvia.nativev2.

          **Important:** This is a DEBUG prerelease, not an update to the
          established Orvia Flutter app. It installs separately. Existing
          Orvia data does not migrate to it. Orvia-specific integrations,
          compatibility and runtime behavior have not been fully verified.

          The original LastChat code and required AGPL-3.0 notices remain
          attributed to their upstream authors.
          EOF
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.0.0-native-ui-preview.1
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" Orvia-2-Native-UI-Preview.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Orvia 2.0 Native UI Preview 1" \
            --prerelease \
            --notes-file RELEASE-NOTES.md
