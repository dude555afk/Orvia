name: Apply Safe English Cleanup

on:
  push:
    branches:
      - fix/complete-orvia-bootstrap

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.44.9'
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/complete-orvia-bootstrap
          fetch-depth: 0

      - name: Apply semantic English cleanup
        run: python3 tool/safe_english_cleanup.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only -- '*.dart' || true)"
          if [ -n "$files" ]; then
            dart format $files
          fi

      - name: Regenerate localization
        run: flutter gen-l10n

      - name: Verify no first-party CJK
        run: python3 tool/check_no_cjk_first_party.py

      - name: Analyze
        run: dart analyze --fatal-infos lib test integration_test

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Remove one-shot cleanup machinery
        run: |
          rm -f tool/safe_english_cleanup.py
          rm -f .github/workflows/safe-english-cleanup.yml

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Complete safe English-only cleanup"
          git push origin HEAD:fix/complete-orvia-bootstrap
