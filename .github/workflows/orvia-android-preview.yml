name: Orvia Android Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvia-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ORVIA_PREVIEW_ARM64_ONLY: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reclaim unused runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          df -h /
          # The preview does not use .NET, GHC, PowerShell, CodeQL or emulator images.
          # Keep Android SDK/NDK/CMake and Flutter toolcache intact.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images
          echo "After cleanup:"
          df -h /
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Generate Orvia launcher icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build unsigned debug APK
        shell: bash
        run: |
          df -h /
          flutter build apk --debug --target-platform android-arm64
          df -h /
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: Orvia-Android-arm64-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
