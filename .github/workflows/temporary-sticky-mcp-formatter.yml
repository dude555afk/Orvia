name: Temporary MCP formatting

on:
  push:
    branches: [fix/mcp-sticky-global-selection-20261014]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Run formatter and commit
        run: |
          set -euo pipefail
          dart format lib/core/providers/assistant_provider.dart lib/core/services/chat/chat_service.dart lib/core/database/business_settings_router.dart lib/features/assistant/pages/assistant_settings_edit_mcp_tab.dart lib/features/mcp/widgets/mcp_conversation_sheet.dart lib/features/home/widgets/chat_input_section.dart test/core/providers/assistant_provider_search_test.dart test/core/services/chat/chat_service_mcp_selection_persistence_test.dart test/core/services/mcp/mcp_tool_service_test.dart test/features/home/services/tool_handler_service_test.dart test/features/home/widgets/chat_input_section_capability_scope_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/providers/assistant_provider.dart lib/core/services/chat/chat_service.dart lib/core/database/business_settings_router.dart lib/features/assistant/pages/assistant_settings_edit_mcp_tab.dart lib/features/mcp/widgets/mcp_conversation_sheet.dart lib/features/home/widgets/chat_input_section.dart test/core/providers/assistant_provider_search_test.dart test/core/services/chat/chat_service_mcp_selection_persistence_test.dart test/core/services/mcp/mcp_tool_service_test.dart test/features/home/services/tool_handler_service_test.dart test/features/home/widgets/chat_input_section_capability_scope_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(mcp): Dart-format MCP regression fix"
            git push origin HEAD:fix/mcp-sticky-global-selection-20261014
          fi
