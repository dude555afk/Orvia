name: Flutter Multi-Platform Build Stable

env:
  FLUTTER_VERSION: '3.44.9'

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android'
        required: false
        default: true
        type: boolean
      build_ios:
        description: '构建 iOS'
        required: false
        default: true
        type: boolean
      build_mac:
        description: '构建 macOS'
        required: false
        default: true
        type: boolean
      build_windows:
        description: '构建 Windows'
        required: false
        default: true
        type: boolean
      build_linux:
        description: '构建 Linux'
        required: false
        default: true
        type: boolean
      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签（如 v1.0.0）'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-stable-44.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.inputs.publish_release != 'true' }}

jobs:
  android:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_android != 'false') }}
    name: 构建 Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"
      - name: 🔨 Build debug APK (no signing required)
        run: flutter build apk --debug

      - name: 📦 Rename debug APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-debug.apk Orvia_android_${VERSION}_debug.apk
      - name: 📤 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-debug
          path: build/app/outputs/flutter-apk/Orvia_android_*_debug.apk

      # 如果有签名密钥，写入密钥文件
      - name: 🔑 Configure Android release signing
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Android release signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          test -s android/app/key.jks
          {
            printf 'storeFile=key.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/key.jks android/key.properties

      - name: 🏗️ 构建 APK
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: flutter build apk --release --split-per-abi

      - name: 📦 重命名 APK
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "Orvia_android_${VERSION}_${abi}.apk"
          done
      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            build/app/outputs/flutter-apk/Orvia_android_*_arm64-v8a.apk
            build/app/outputs/flutter-apk/Orvia_android_*_armeabi-v7a.apk
            build/app/outputs/flutter-apk/Orvia_android_*_x86_64.apk

      - name: 📤 上传构建产物 (arm64-v8a)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-arm64-v8a
          path: build/app/outputs/flutter-apk/Orvia_android_*_arm64-v8a.apk

      - name: 📤 上传构建产物 (armeabi-v7a)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/Orvia_android_*_armeabi-v7a.apk

      - name: 📤 上传构建产物 (x86_64)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86_64
          path: build/app/outputs/flutter-apk/Orvia_android_*_x86_64.apk

  # iOS 构建
  ios:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios != 'false') }}
    name: 构建 iOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"
      - name: 🏗️ 构建 iOS (无签名)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../Orvia_ios_${VERSION}.ipa Payload
      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: Orvia_ios_*.ipa

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Orvia_ios_*.ipa

  # macOS 构建
  macos:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mac != 'false') }}
    name: 构建 macOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 获取版本号
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: 🏗️ 构建 macOS
        run: flutter build macos --release

      - name: 📦 创建 DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Orvia" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "Orvia_macos_${VERSION}.dmg" \
            "build/macos/Build/Products/Release/kelivo.app" || true
          if [ ! -f "Orvia_macos_${VERSION}.dmg" ]; then
            hdiutil create -volname Orvia -srcfolder build/macos/Build/Products/Release/kelivo.app -ov -format UDZO Orvia_macos_${VERSION}.dmg
          fi
      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: Orvia_macos_*.dmg

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: Orvia_macos_*.dmg

  # Windows 构建
  windows:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows != 'false') }}
    name: 构建 Windows
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 安装最新 CMake
        uses: lukka/get-cmake@latest

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 🔧 获取依赖
        run: flutter pub get

      - name: 🔍 验证 CMake 版本
        shell: pwsh
        run: |
          Write-Host "检查 CMake 版本..."
          cmake --version
          $cmakeVersion = (cmake --version | Select-String "cmake version" | ForEach-Object { $_.ToString() })
          Write-Host "当前 CMake: $cmakeVersion"
      - name: 📝 获取版本号
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern "version:" | ForEach-Object { $_.Line.Split(":")[1].Trim() })
          if ("${{ github.event.inputs.publish_release }}" -ne "true") {
            $shortSha = git rev-parse --short HEAD
            $version = "$version`_$shortSha"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "版本号: $version"
      - name: 🏗️ 构建 Windows
        run: flutter build windows --release

      - name: 📦 打包 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Orvia_windows_$env:VERSION.zip"
      - name: 🔧 安装 Inno Setup
        run: choco install innosetup -y

      - name: 📦 创建安装程序
        shell: pwsh
        run: |
          $zhLangCompiler = "C:\\Program Files (x86)\\Inno Setup 6\\Languages\\ChineseSimplified.isl"
          $zhLangLocalDir = Join-Path (Get-Location) "Languages"
          $zhLangLocal = Join-Path ($zhLangLocalDir, "ChineseSimplified.isl")
          $languagesBlock = $null
          if (Test-Path $zhLangCompiler) {
            Write-Host "✅ 检测到中文语言文件: $zhLangCompiler"
            $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
          } else {
            Write-Host "⚠️ 未在 Inno Setup 安装目录找到中文语言文件，尝试下载到本地项目..."
            try {
              New-Item -ItemType Directory -Force -Path $zhLangLocalDir | Out-Null
              $uri = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
              Invoke-WebRequest -Uri $uri -OutFile $zhLangLocal -UseBasicParsing -TimeoutSec 60
              if (Test-Path $zhLangLocal) {
                Write-Host "✅ 已下载中文语言文件: $zhLangLocal"
                $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "$zhLangLocal"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
              }
            } catch {
              Write-Host "⚠️ 下载中文语言文件失败: $($_.Exception.Message)"
            }
            if (-not $languagesBlock) {
              Write-Host "ℹ️ 将仅包含英文安装向导"
              $languagesBlock = @"
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
            }
          }
          $issContent = @"
          #define MyAppName "Orvia"
          #define MyAppVersion "$env:VERSION"
          #define MyAppPublisher "Orvia"
          #define MyAppExeName "kelivo.exe"

          [Setup]
          AppId={{A7B8C9D0-E1F2-4A5B-8C9D-0E1F2A3B4C5D}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=.
          OutputBaseFilename=Orvia_windows_{#MyAppVersion}_setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          UninstallDisplayIcon={app}\{#MyAppExeName}
          $languagesBlock
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加图标:"
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\卸载 {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "启动 {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@
          
          $issContent | Out-File -FilePath "installer.iss" -Encoding utf8BOM
          
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"
      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            Orvia_windows_*.zip
            Orvia_windows_*_setup.exe
      - name: 📤 上传构建产物 (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ZIP
          path: Orvia_windows_*.zip

      - name: 📤 上传构建产物 (Installer)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: Orvia_windows_*_setup.exe

  # Linux 构建
  linux:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux != 'false') }}
    name: 构建 Linux
    runs-on: ubuntu-22.04
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 安装依赖
        run: |
          sudo apt-get update
          mapfile -t unwind_conflicts < <(dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' 'libunwind-*-dev' 2>/dev/null | awk '$2 == "installed" {print $1}' || true)
          if [ "${#unwind_conflicts[@]}" -gt 0 ]; then
            sudo apt-get remove -y "${unwind_conflicts[@]}"
          fi
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            rpm patchelf libfuse2 file \
            libkeybinder-3.0-dev libayatana-appindicator3-dev
      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 获取版本号
        run: |
          RAW_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION=$RAW_VERSION
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUMBER=$(echo $RAW_VERSION | cut -d'+' -f1)" >> $GITHUB_ENV
      - name: 🏗️ 构建 Linux
        run: flutter build linux --release

      - name: 📦 打包 tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../Orvia_linux_${VERSION}.tar.gz .
      - name: 📦 创建 AppImage
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/kelivo" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          cat > AppDir/orvia.desktop << EOF
          [Desktop Entry]
          Name=Orvia
          Exec=kelivo
          Icon=orvia
          Type=Application
          Categories=Utility;
          EOF
          
          ICON_SOURCE="linux/orvia.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          install -Dm644 "$ICON_SOURCE" AppDir/orvia.png
          install -Dm644 "$ICON_SOURCE" "AppDir/usr/share/icons/hicolor/256x256/apps/orvia.png"
          
          ARCH=x86_64 ./appimagetool AppDir Orvia_linux_${VERSION}.AppImage
      - name: 📦 创建 DEB 包
        run: |
          mkdir -p deb/DEBIAN
          mkdir -p deb/opt/orvia
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps
          
          cp -r build/linux/x64/release/bundle/* deb/opt/orvia/
          
          mkdir -p deb/usr/bin
          ln -s /opt/orvia/kelivo deb/usr/bin/kelivo
          
          cat > deb/DEBIAN/control << EOF
          Package: orvia
          Version: ${VERSION_NUMBER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Orvia <orvia@example.com>
          Depends: libgtk-3-0, libstdc++6, libglu1-mesa, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, libglib2.0-0, libc6
          Description: Orvia Application
           A Flutter application for Linux
          EOF
          
          cat > deb/usr/share/applications/orvia.desktop << EOF
          [Desktop Entry]
          Name=Orvia
          Exec=/opt/orvia/kelivo
          Icon=orvia
          Type=Application
          Categories=Utility;
          EOF

          ICON_SOURCE="linux/orvia.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          install -Dm644 "$ICON_SOURCE" deb/usr/share/icons/hicolor/256x256/apps/orvia.png
          
          cat > deb/opt/orvia/kelivo.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./kelivo "$@"
          EOF
          chmod +x deb/opt/orvia/kelivo.sh
          
          dpkg-deb --build deb Orvia_linux_${VERSION}_amd64.deb
      - name: 📦 创建 RPM 包
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          mkdir -p orvia-${VERSION_NUMBER}
          cp -r build/linux/x64/release/bundle/* orvia-${VERSION_NUMBER}/
          ICON_SOURCE="linux/orvia.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          cp "$ICON_SOURCE" orvia-${VERSION_NUMBER}/orvia.png
          tar -czf ~/rpmbuild/SOURCES/orvia-${VERSION_NUMBER}.tar.gz orvia-${VERSION_NUMBER}
          
          cat > ~/rpmbuild/SPECS/orvia.spec << EOF
          Name:           orvia
          Version:        ${VERSION_NUMBER}
          Release:        1%{?dist}
          Summary:        Orvia Application
          License:        MIT
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      x86_64
          Requires:       gtk3, libstdc++ >= 6, mesa-libGLU, gstreamer1, gstreamer1-plugins-base1.0-0, glib2, glibc
          
          %description
          A Flutter application for Linux
          
          %prep
          %setup -q
          
          %install
          mkdir -p %{buildroot}/opt/orvia
          cp -r * %{buildroot}/opt/orvia/
          
          mkdir -p %{buildroot}/usr/bin
          ln -s /opt/orvia/kelivo %{buildroot}/usr/bin/kelivo
          
          mkdir -p %{buildroot}/usr/share/applications
          cat > %{buildroot}/usr/share/applications/orvia.desktop << 'DESKTOPEOF'
          [Desktop Entry]
          Name=Orvia
          Exec=/opt/orvia/kelivo
          Icon=orvia
          Type=Application
          Categories=Utility;
          DESKTOPEOF

          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp orvia.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/orvia.png
          
          %files
          /opt/orvia/*
          /usr/bin/kelivo
          /usr/share/applications/orvia.desktop
          /usr/share/icons/hicolor/256x256/apps/orvia.png
          
          %changelog
          * $(date "+%a %b %d %Y") Orvia <orvia@example.com> - ${VERSION_NUMBER}-1
          - Initial RPM release
          EOF
          
          rpmbuild -bb ~/rpmbuild/SPECS/orvia.spec
          cp ~/rpmbuild/RPMS/x86_64/orvia-${VERSION_NUMBER}-1.*.rpm Orvia_linux_${VERSION}.rpm
      - name: 🔍 RPM 元数据（调试）
        shell: bash
        run: |
          set -euxo pipefail
          RPM_FILE="Orvia_linux_${VERSION}.rpm"
          echo "RPM file: ${RPM_FILE}"
          cp -f ~/rpmbuild/SPECS/orvia.spec rpm-spec.spec
          rpm -qp --info "${RPM_FILE}" | tee rpm-info.txt
          rpm -qp --requires "${RPM_FILE}" | tee rpm-requires.txt
          rpm -qp --provides "${RPM_FILE}" | tee rpm-provides.txt
      - name: 📤 上传 RPM 元数据（调试）
        uses: actions/upload-artifact@v4
        with:
          name: Linux-RPM-Metadata
          path: |
            rpm-spec.spec
            rpm-info.txt
            rpm-requires.txt
            rpm-provides.txt
      - name: 🧪 Fedora 43 安装测试
        shell: bash
        run: |
          set -euxo pipefail
          RPM_FILE="Orvia_linux_${VERSION}.rpm"
          docker run --rm -v "${PWD}:/work" -w /work fedora:43 bash -lc "dnf -y install ./${RPM_FILE}"
      - name: 🚀 发布到 Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            Orvia_linux_*.tar.gz
            Orvia_linux_*.AppImage
            Orvia_linux_*_amd64.deb
            Orvia_linux_*.rpm
      - name: 📤 上传构建产物 (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-tar.gz
          path: Orvia_linux_*.tar.gz

      - name: 📤 上传构建产物 (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-AppImage
          path: Orvia_linux_*.AppImage

      - name: 📤 上传构建产物 (DEB)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-DEB
          path: Orvia_linux_*_amd64.deb

      - name: 📤 上传构建产物 (RPM)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-RPM
          path: Orvia_linux_*.rpm
