name: Temporary Edge UI formatter
on:
  push:
    branches: [fix/edge-native-voice-updater-ui-20261015]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Format Edge and updater files
        run: |
          set -euo pipefail
          dart format lib/core/services/tts/edge_modern_client.dart lib/core/services/tts/edge_v2_token.dart lib/core/services/tts/network_tts.dart lib/features/settings/pages/about_page.dart test/core/services/tts/network_tts_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/tts/edge_modern_client.dart lib/core/services/tts/edge_v2_token.dart lib/core/services/tts/network_tts.dart lib/features/settings/pages/about_page.dart test/core/services/tts/network_tts_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Dart formatter to Edge v2 and updater UI"
            git push origin HEAD:fix/edge-native-voice-updater-ui-20261015
          fi
