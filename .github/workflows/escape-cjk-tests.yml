name: Escape CJK Test Fixtures Once

on:
  push:
    branches:
      - fix/complete-orvia-bootstrap
    paths:
      - .github/workflows/escape-cjk-tests.yml

permissions:
  contents: write

jobs:
  escape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/complete-orvia-bootstrap
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Escape raw CJK in Dart tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ranges = (
              (0x3400, 0x4DBF),
              (0x4E00, 0x9FFF),
              (0xF900, 0xFAFF),
          )

          def is_cjk(ch):
              cp = ord(ch)
              return any(lo <= cp <= hi for lo, hi in ranges)

          changed = []
          for path in Path('test').rglob('*.dart'):
              text = path.read_text(encoding='utf-8')
              out = ''.join(
                  (f'\\u{ord(ch):04X}' if is_cjk(ch) else ch)
                  for ch in text
              )
              if out != text:
                  path.write_text(out, encoding='utf-8')
                  changed.append(str(path))

          print(f'Escaped CJK in {len(changed)} Dart test files')
          for p in changed:
              print(p)
          PY

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR -- 'test/**/*.dart' 'test/*.dart')
          if [ "${#files[@]}" -gt 0 ]; then
            dart format "${files[@]}"
          fi

          if git diff --quiet; then
            echo "No CJK changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test
          git commit -m "test: escape remaining CJK fixtures"
          git push origin HEAD:fix/complete-orvia-bootstrap
