name: One-shot updater formatter

on:
  push:
    branches:
      - cleanup/remove-china-defaults
    paths:
      - .github/workflows/orvia-update-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - run: dart format lib/core/providers/update_provider.dart lib/features/home/widgets/side_drawer.dart
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add lib/core/providers/update_provider.dart lib/features/home/widgets/side_drawer.dart
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format in-app updater changes'
          git push origin HEAD:cleanup/remove-china-defaults
