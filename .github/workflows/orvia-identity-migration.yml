name: One-shot Orvia identity migration

on:
  push:
    branches:
      - cleanup/orvia-identity
    paths:
      - tool/orvia_identity_migration.py
      - .github/workflows/orvia-identity-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Orvia identity migration
        run: python3 tool/orvia_identity_migration.py

      - name: Verify Orvia identity
        run: python3 tool/check_orvia_identity.py

      - name: Commit migrated tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: complete Orvia identity migration'
          git push origin HEAD:cleanup/orvia-identity
