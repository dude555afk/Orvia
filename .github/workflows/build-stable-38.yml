name: Flutter Multi-Platform Build Stable 3.38

env:
  FLUTTER_VERSION: '3.44.9'  # Set this to the Flutter version you need

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      # Choose build platforms
      build_android:
        description: 'Build Android'
        required: false
        default: true
        type: boolean

      build_ios:
        description: 'Build iOS'
        required: false
        default: true
        type: boolean

      build_mac:
        description: 'Build macOS'
        required: false
        default: true
        type: boolean

      build_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean

      build_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean

      # Publish to Release (disabled by default)
      publish_release:
        description: 'Publish to Release'
        required: false
        default: false
        type: boolean

      # Release tag (required only when publishing)
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''
        type: string

      # Whether this is a pre-release
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-stable-38-${{ github.ref }}
  cancel-in-progress: ${{ github.event.inputs.publish_release != 'true' }}

jobs:
  # Android build
  android:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_android != 'false') }}
    name: Build Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 Get version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"
      # Write signing key files when signing secrets are available
      - name: 🔑 Configure Android release signing
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Android release signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          test -s android/app/key.jks
          {
            printf 'storeFile=key.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/key.jks android/key.properties

      - name: 🏗️ Build APK
        run: flutter build apk --release --split-per-abi

      - name: 📦 Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "Kelivo_android_${VERSION}_${abi}.apk"
          done
      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: build/app/outputs/flutter-apk/Kelivo_android_*.apk

      - name: 📤 Upload build artifact (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: Android-arm64-v8a
          path: build/app/outputs/flutter-apk/Kelivo_android_*_arm64-v8a.apk

      - name: 📤 Upload build artifact (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/Kelivo_android_*_armeabi-v7a.apk

      - name: 📤 Upload build artifact (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86_64
          path: build/app/outputs/flutter-apk/Kelivo_android_*_x86_64.apk

  # iOS build
  ios:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios != 'false') }}
    name: Build iOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 Get version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"
      - name: 🏗️ Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../Kelivo_ios_${VERSION}.ipa Payload
      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: Kelivo_ios_*.ipa

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Kelivo_ios_*.ipa

  # macOS build
  macos:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mac != 'false') }}
    name: Build macOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 Get version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: 🏗️ Build macOS
        run: flutter build macos --release

      - name: 📦 Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Kelivo" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "Kelivo_macos_${VERSION}.dmg" \
            "build/macos/Build/Products/Release/kelivo.app" || true
          # If create-dmg fails, use the fallback method
          if [ ! -f "Kelivo_macos_${VERSION}.dmg" ]; then
            hdiutil create -volname Kelivo -srcfolder build/macos/Build/Products/Release/kelivo.app -ov -format UDZO Kelivo_macos_${VERSION}.dmg
          fi
      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: Kelivo_macos_*.dmg

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: Kelivo_macos_*.dmg

  # Windows build
  windows:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows != 'false') }}
    name: Build Windows
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install latest CMake
        uses: lukka/get-cmake@latest

      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 🔧 Get dependencies
        run: flutter pub get

      - name: 🔍 Verify CMake version
        shell: pwsh
        run: |
          Write-Host "Checking CMake version..."
          cmake --version
          $cmakeVersion = (cmake --version | Select-String "cmake version" | ForEach-Object { $_.ToString() })
          Write-Host "Current CMake: $cmakeVersion"
      - name: 📝 Get version
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern "version:" | ForEach-Object { $_.Line.Split(":")[1].Trim() })
          if ("${{ github.event.inputs.publish_release }}" -ne "true") {
            $shortSha = git rev-parse --short HEAD
            $version = "$version`_$shortSha"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"
      - name: 🏗️ Build Windows
        run: flutter build windows --release

      - name: 📦 Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Kelivo_windows_$env:VERSION.zip"
      - name: 🔧 Install Inno Setup
        run: choco install innosetup -y

      - name: 📦 Create installer
        shell: pwsh
        run: |
          # Language-file detection (the Chinese pack may be missing on some runners, so avoid failing the build)
          $zhLangCompiler = "C:\\Program Files (x86)\\Inno Setup 6\\Languages\\ChineseSimplified.isl"
          $zhLangLocalDir = Join-Path (Get-Location) "Languages"
          $zhLangLocal = Join-Path $zhLangLocalDir "ChineseSimplified.isl"
          $languagesBlock = $null
          if (Test-Path $zhLangCompiler) {
            Write-Host "✅ Chinese language file found: $zhLangCompiler"
            $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
          } else {
            Write-Host "⚠️ Chinese language file not found in the Inno Setup directory; trying a local download..."
            try {
              New-Item -ItemType Directory -Force -Path $zhLangLocalDir | Out-Null
              $uri = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
              Invoke-WebRequest -Uri $uri -OutFile $zhLangLocal -UseBasicParsing -TimeoutSec 60
              if (Test-Path $zhLangLocal) {
                Write-Host "✅ Downloaded Chinese language file: $zhLangLocal"
                $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "$zhLangLocal"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
              }
            } catch {
              Write-Host "⚠️ Failed to download Chinese language file: $($_.Exception.Message)"
            }
            if (-not $languagesBlock) {
              Write-Host "ℹ️ Installer will use English only"
              $languagesBlock = @"
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
            }
          }
          # Create Inno Setup script
          $issContent = @"
          #define MyAppName "Kelivo"
          #define MyAppVersion "$env:VERSION"
          #define MyAppPublisher "Psyche"
          #define MyAppExeName "kelivo.exe"
          [Setup]
          AppId={{A7B8C9D0-E1F2-4A5B-8C9D-0E1F2A3B4C5D}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=.
          OutputBaseFilename=Kelivo_windows_{#MyAppVersion}_setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          UninstallDisplayIcon={app}\{#MyAppExeName}
          $languagesBlock
          [Tasks]
          Name: "desktopicon"; Description: "Create desktop shortcut"; GroupDescription: "Additional icons:"
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\Uninstall {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@
          
          # Use UTF-8 BOM so non-ASCII text is parsed correctly by Inno Setup
          $issContent | Out-File -FilePath "installer.iss" -Encoding utf8BOM
          
          # Compile installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"
      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            Kelivo_windows_*.zip
            Kelivo_windows_*_setup.exe
      - name: 📤 Upload build artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ZIP
          path: Kelivo_windows_*.zip

      - name: 📤 Upload build artifact (Installer)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: Kelivo_windows_*_setup.exe

  # Linux build
  linux:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux != 'false') }}
    name: Build Linux
    runs-on: ubuntu-22.04
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update
          mapfile -t unwind_conflicts < <(dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' 'libunwind-*-dev' 2>/dev/null | awk '$2 == "installed" {print $1}' || true)
          if [ "${#unwind_conflicts[@]}" -gt 0 ]; then
            sudo apt-get remove -y "${unwind_conflicts[@]}"
          fi
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev libunwind-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            rpm patchelf libfuse2 file \
            libkeybinder-3.0-dev libayatana-appindicator3-dev
      - name: 🐦 Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF
      - name: 📝 Get version
        run: |
          RAW_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION=$RAW_VERSION
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUMBER=$(echo $RAW_VERSION | cut -d'+' -f1)" >> $GITHUB_ENV
      - name: 🏗️ Build Linux
        run: flutter build linux --release

      - name: 📦 Package tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../Kelivo_linux_${VERSION}.tar.gz .
      - name: 📦 Create AppImage
        run: |
          # Download appimagetool
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          # Create AppRun script
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/kelivo" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Create desktop file
          cat > AppDir/kelivo.desktop << EOF
          [Desktop Entry]
          Name=Kelivo
          Exec=kelivo
          Icon=kelivo
          Type=Application
          Categories=Utility;
          EOF
          
          ICON_SOURCE="linux/kelivo.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          install -Dm644 "$ICON_SOURCE" AppDir/kelivo.png
          install -Dm644 "$ICON_SOURCE" "AppDir/usr/share/icons/hicolor/256x256/apps/kelivo.png"
          
          # Build AppImage
          ARCH=x86_64 ./appimagetool AppDir Kelivo_linux_${VERSION}.AppImage
      - name: 📦 Create DEB package
        run: |
          # Create DEB directory structure
          mkdir -p deb/DEBIAN
          mkdir -p deb/opt/kelivo
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps
          
          # Copy files
          cp -r build/linux/x64/release/bundle/* deb/opt/kelivo/
          
          # Create /usr/bin symlink
          mkdir -p deb/usr/bin
          ln -s /opt/kelivo/kelivo deb/usr/bin/kelivo
          
          # Create control file
          cat > deb/DEBIAN/control << EOF
          Package: kelivo
          Version: ${VERSION_NUMBER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Psyche <your@email.com>
          Depends: libgtk-3-0, libstdc++6, libglu1-mesa, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, libglib2.0-0, libc6
          Description: Kelivo Application
           A Flutter application for Linux
          EOF
          
          # Create desktop file
          cat > deb/usr/share/applications/kelivo.desktop << EOF
          [Desktop Entry]
          Name=Kelivo
          Exec=/opt/kelivo/kelivo
          Icon=kelivo
          Type=Application
          Categories=Utility;
          EOF

          ICON_SOURCE="linux/kelivo.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          install -Dm644 "$ICON_SOURCE" deb/usr/share/icons/hicolor/256x256/apps/kelivo.png
          
          # Create launch script
          cat > deb/opt/kelivo/kelivo.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./kelivo "$@"
          EOF
          chmod +x deb/opt/kelivo/kelivo.sh
          
          # Build DEB package
          dpkg-deb --build deb Kelivo_linux_${VERSION}_amd64.deb
      - name: 📦 Create RPM package
        run: |
          # Create RPM build directory
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # Create source directory
          mkdir -p kelivo-${VERSION_NUMBER}
          cp -r build/linux/x64/release/bundle/* kelivo-${VERSION_NUMBER}/
          ICON_SOURCE="linux/kelivo.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          cp "$ICON_SOURCE" kelivo-${VERSION_NUMBER}/kelivo.png
          tar -czf ~/rpmbuild/SOURCES/kelivo-${VERSION_NUMBER}.tar.gz kelivo-${VERSION_NUMBER}
          
          # Create spec file
          cat > ~/rpmbuild/SPECS/kelivo.spec << EOF
          Name:           kelivo
          Version:        ${VERSION_NUMBER}
          Release:        1%{?dist}
          Summary:        Kelivo Application
          License:        MIT
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      x86_64
          Requires:       gtk3, libstdc++ >= 6, mesa-libGLU, gstreamer1, gstreamer1-plugins-base, glib2, glibc
          
          %description
          A Flutter application for Linux
          
          %prep
          %setup -q
          
          %install
          mkdir -p %{buildroot}/opt/kelivo
          cp -r * %{buildroot}/opt/kelivo/
          
          mkdir -p %{buildroot}/usr/bin
          ln -s /opt/kelivo/kelivo %{buildroot}/usr/bin/kelivo
          
          mkdir -p %{buildroot}/usr/share/applications
          cat > %{buildroot}/usr/share/applications/kelivo.desktop << 'DESKTOPEOF'
          [Desktop Entry]
          Name=Kelivo
          Exec=/opt/kelivo/kelivo
          Icon=kelivo
          Type=Application
          Categories=Utility;
          DESKTOPEOF

          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp kelivo.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/kelivo.png
          
          %files
          /opt/kelivo/*
          /usr/bin/kelivo
          /usr/share/applications/kelivo.desktop
          /usr/share/icons/hicolor/256x256/apps/kelivo.png
          
          %changelog
          * $(date "+%a %b %d %Y") Psyche <your@email.com> - ${VERSION_NUMBER}-1
          - Initial RPM release
          EOF
          
          # Build RPM
          rpmbuild -bb ~/rpmbuild/SPECS/kelivo.spec
          cp ~/rpmbuild/RPMS/x86_64/kelivo-${VERSION_NUMBER}-1.*.rpm Kelivo_linux_${VERSION}.rpm
      - name: 🔍 RPM metadata (debug)
        shell: bash
        run: |
          set -euxo pipefail
          RPM_FILE="Kelivo_linux_${VERSION}.rpm"
          echo "RPM file: ${RPM_FILE}"
          cp -f ~/rpmbuild/SPECS/kelivo.spec rpm-spec.spec
          rpm -qp --info "${RPM_FILE}" | tee rpm-info.txt
          rpm -qp --requires "${RPM_FILE}" | tee rpm-requires.txt
          rpm -qp --provides "${RPM_FILE}" | tee rpm-provides.txt
      - name: 📤 Upload RPM metadata (debug)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-RPM-Metadata
          path: |
            rpm-spec.spec
            rpm-info.txt
            rpm-requires.txt
            rpm-provides.txt
      - name: 🧪 Fedora 43 install test
        shell: bash
        run: |
          set -euxo pipefail
          RPM_FILE="Kelivo_linux_${VERSION}.rpm"
          docker run --rm -v "${PWD}:/work" -w /work fedora:43 bash -lc "dnf -y install ./${RPM_FILE}"
      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            Kelivo_linux_*.tar.gz
            Kelivo_linux_*.AppImage
            Kelivo_linux_*_amd64.deb
            Kelivo_linux_*.rpm
      - name: 📤 Upload build artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-tar.gz
          path: Kelivo_linux_*.tar.gz

      - name: 📤 Upload build artifact (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-AppImage
          path: Kelivo_linux_*.AppImage

      - name: 📤 Upload build artifact (DEB)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-DEB
          path: Kelivo_linux_*_amd64.deb

      - name: 📤 Upload build artifact (RPM)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-RPM
          path: Kelivo_linux_*.rpm