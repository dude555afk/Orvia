name: Orvia 2.0 Native Preview

on:
  push:
    branches: [feature/orvia-2-native]
    paths:
      - 'native-v2/**'
      - '.github/workflows/orvia-native-preview.yml'
  workflow_dispatch:

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build standalone native preview
        working-directory: native-v2
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: orvia-v2-native-preview-debug
          path: native-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
