name: Kairon rebuild checks

on:
  push:
    branches:
      - feature/kairon-rebuild

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check migrated Dart formatting
        run: |
          dart format --output=none --set-exit-if-changed             lib/core/models/message_part.dart             lib/features/chat/widgets/dynamic_ui_view.dart             lib/features/chat/widgets/chat_message_widget.dart

      - name: Analyze migrated chat code
        run: |
          dart analyze             lib/core/models/message_part.dart             lib/features/chat/widgets/dynamic_ui_view.dart             lib/features/chat/widgets/chat_message_widget.dart

      - name: Compile Android debug APK
        run: flutter build apk --debug
