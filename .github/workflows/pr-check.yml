name: PR Checks

env:
  FLUTTER_VERSION: '3.44.9'

on:
  push:
    branches: [feature/orvia-rebrand-parity-restart-20261029]
  pull_request:
    branches: [main]

concurrency:
  group: orvia-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze / Test / L10n / Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format (changed files only)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          files="$(git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$HEAD_SHA" -- | grep -E '^(lib|test|integration_test)/.*\.dart$' || true)"
          if [ -z "$files" ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          echo "Format-checking files:"
          echo "$files"
          dart format --output=none --set-exit-if-changed $files

      - name: Format-check Orvia migration files
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/core/providers/settings_provider.dart \
            lib/core/providers/tts_provider.dart \
            lib/core/providers/model_provider.dart \
            lib/core/services/tts/network_tts.dart \
            lib/core/services/api/chat_api_helpers.dart \
            lib/features/provider/pages/providers_page.dart \
            lib/features/settings/pages/tts_services_page.dart \
            test/core/providers/provider_preset_migration_test.dart \
            test/core/services/api/chat_api_helpers_anonymous_headers_test.dart \
            test/core/services/tts/network_tts_test.dart \
            test/settings_provider_reasoning_support_test.dart

      - name: Generate l10n and ensure committed outputs
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: No new untranslated messages (PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
            rm -rf "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          pushd "$BASE_DIR" >/dev/null
          flutter pub get
          flutter gen-l10n
          popd >/dev/null

          python3 .github/scripts/check_no_new_untranslated.py \
            "$BASE_DIR/desiredFileName.txt" \
            "desiredFileName.txt"

      - name: No first-party Chinese text
        run: python3 tool/check_no_cjk_first_party.py

      - name: Orvia identity guard
        run: python3 tool/check_orvia_identity.py

      - name: dart analyze (root package only)
        run: dart analyze --fatal-infos lib test integration_test

      - name: flutter test
        run: flutter test
