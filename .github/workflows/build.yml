name: Flutter Multi-Platform Build Master

env:
  FLUTTER_CHANNEL: 'master'

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android'
        required: false
        default: true
        type: boolean
      build_ios:
        description: 'Build iOS'
        required: false
        default: true
        type: boolean
      build_mac:
        description: 'Build macOS'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish to Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''
        type: string
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event.inputs.publish_release != 'true' }}

jobs:
  android:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_android != 'false') }}
    name: Build Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Install Flutter (Master)
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 Get version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      # Fail closed: public release APKs must never be silently unsigned.
      - name: 🔑 Configure Android release signing
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Android release signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          test -s android/app/key.jks
          {
            printf 'storeFile=key.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/key.jks android/key.properties

      - name: 🏗️ Build signed release APKs
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: flutter build apk --release --split-per-abi

      - name: 🔍 Verify release signatures
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not set"
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APKs found"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
            sha256sum "$apk"
          done

      - name: 📦 Rename signed APKs
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "Orvia_android_${VERSION}_${abi}.apk"
          done

      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: |
            build/app/outputs/flutter-apk/Orvia_android_*_arm64-v8a.apk
            build/app/outputs/flutter-apk/Orvia_android_*_armeabi-v7a.apk
            build/app/outputs/flutter-apk/Orvia_android_*_x86_64.apk

      - name: 📤 Upload build artifact (arm64-v8a)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-arm64-v8a
          path: build/app/outputs/flutter-apk/Orvia_android_*_arm64-v8a.apk

      - name: 📤 Upload build artifact (armeabi-v7a)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/Orvia_android_*_armeabi-v7a.apk

      - name: 📤 Upload build artifact (x86_64)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86_64
          path: build/app/outputs/flutter-apk/Orvia_android_*_x86_64.apk

  # iOS build
  ios:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios != 'false') }}
    name: Build iOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Install Flutter (Master)
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 Get version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: 🧰 Cache iSH sandbox artifacts
        uses: actions/cache@v4
        with:
          path: |
            ios/sandbox/build
            ios/sandbox/resources/alpine-rootfs.zip
            ios/sandbox/resources/libvdso.so.elf
          key: ${{ runner.os }}-${{ runner.arch }}-ish-sandbox-${{ hashFiles('ios/sandbox/build_ish.sh', 'ios/sandbox/ensure_artifacts.sh', 'ios/sandbox/patches/*.patch', 'ios/sandbox/prepare_alpine_rootfs.sh', 'ios/sandbox/resources/VERSION') }}

      - name: 🧰 Prepare iSH sandbox artifacts
        run: |
          brew install meson ninja llvm lld
          ios/sandbox/ensure_artifacts.sh

      - name: 🏗️ Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../Orvia_ios_${VERSION}.ipa Payload

      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: Orvia_ios_*.ipa

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: Orvia_ios_*.ipa

  # macOS build
  macos:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mac != 'false') }}
    name: Build macOS
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Install Flutter (Master)
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 Get version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🏗️ Build macOS
        run: flutter build macos --release

      - name: 📦 Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Orvia" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "Orvia_macos_${VERSION}.dmg" \
            "build/macos/Build/Products/Release/kelivo.app" || true
          if [ ! -f "Orvia_macos_${VERSION}.dmg" ]; then
            hdiutil create -volname Orvia -srcfolder build/macos/Build/Products/Release/kelivo.app -ov -format UDZO Orvia_macos_${VERSION}.dmg
          fi

      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: Orvia_macos_*.dmg

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: Orvia_macos_*.dmg

  # Windows build
  windows:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows != 'false') }}
    name: Build Windows
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install latest CMake
        uses: lukka/get-cmake@latest

      - name: 🐦 Install Flutter (Master)
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 🔧 Get dependencies
        run: flutter pub get

      - name: 🔍 Verify CMake version
        shell: pwsh
        run: |
          Write-Host "Checking CMake version..."
          cmake --version
          $cmakeVersion = (cmake --version | Select-String "cmake version" | ForEach-Object { $_.ToString() })
          Write-Host "Current CMake: $cmakeVersion"

      - name: 📝 Get version
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern "version:" | ForEach-Object { $_.Line.Split(":")[1].Trim() })
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"

      - name: 🏗️ Build Windows
        run: flutter build windows --release

      - name: 📦 Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Orvia_windows_$env:VERSION.zip"

      - name: 🔧 Install Inno Setup
        run: choco install innosetup -y

      - name: 📦 Create installer
        shell: pwsh
        run: |
          $zhLangCompiler = "C:\\Program Files (x86)\\Inno Setup 6\\Languages\\ChineseSimplified.isl"
          $zhLangLocalDir = Join-Path (Get-Location) "Languages"
          $zhLangLocal = Join-Path $zhLangLocalDir "ChineseSimplified.isl"
          $languagesBlock = $null

          if (Test-Path $zhLangCompiler) {
            Write-Host "✅ Chinese language file found: $zhLangCompiler"
            $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
          } else {
            Write-Host "⚠️ Chinese language file not found in the Inno Setup directory; trying a local download..."
            try {
              New-Item -ItemType Directory -Force -Path $zhLangLocalDir | Out-Null
              $uri = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
              Invoke-WebRequest -Uri $uri -OutFile $zhLangLocal -UseBasicParsing -TimeoutSec 60
              if (Test-Path $zhLangLocal) {
                Write-Host "✅ Downloaded Chinese language file: $zhLangLocal"
                $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "$zhLangLocal"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
              }
            } catch {
              Write-Host "⚠️ Failed to download Chinese language file: $($_.Exception.Message)"
            }

            if (-not $languagesBlock) {
              Write-Host "ℹ️ Installer will use English only"
              $languagesBlock = @"
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
            }
          }

          $issContent = @"
          #define MyAppName "Orvia"
          #define MyAppVersion "$env:VERSION"
          #define MyAppPublisher "Orvia"
          #define MyAppExeName "kelivo.exe"

          [Setup]
          AppId={{A7B8C9D0-E1F2-4A5B-8C9D-0E1F2A3B4C5D}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=.
          OutputBaseFilename=Orvia_windows_{#MyAppVersion}_setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          UninstallDisplayIcon={app}\{#MyAppExeName}

          $languagesBlock

          [Tasks]
          Name: "desktopicon"; Description: "Create desktop shortcut"; GroupDescription: "Additional icons:"

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\Uninstall {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@
          
          $issContent | Out-File -FilePath "installer.iss" -Encoding utf8BOM
          
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: |
            Orvia_windows_*.zip
            Orvia_windows_*_setup.exe

      - name: 📤 Upload build artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ZIP
          path: Orvia_windows_*.zip

      - name: 📤 Upload build artifact (Installer)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: Orvia_windows_*_setup.exe

  # Linux build
  linux:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux != 'false') }}
    name: Build Linux
    runs-on: ubuntu-22.04
    permissions: write-all

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update
          mapfile -t unwind_conflicts < <(dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' 'libunwind-*-dev' 2>/dev/null | awk '$2 == "installed" {print $1}' || true)
          if [ "${#unwind_conflicts[@]}" -gt 0 ]; then
            sudo apt-get remove -y "${unwind_conflicts[@]}"
          fi
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            rpm patchelf libfuse2 file \
            libkeybinder-3.0-dev libayatana-appindicator3-dev

      - name: 🐦 Install Flutter (Master)
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 Get version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUMBER=$(echo $VERSION | cut -d'+' -f1)" >> $GITHUB_ENV

      - name: 🏗️ Build Linux
        run: flutter build linux --release

      - name: 📦 Package tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../Orvia_linux_${VERSION}.tar.gz .

      - name: 📦 Create AppImage
        run: |
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/kelivo" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          cat > AppDir/orvia.desktop << EOF
          [Desktop Entry]
          Name=Orvia
          Exec=kelivo
          Icon=orvia
          Type=Application
          Categories=Utility;
          EOF
          
          ICON_SOURCE="linux/orvia.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          install -Dm644 "$ICON_SOURCE" AppDir/orvia.png
          install -Dm644 "$ICON_SOURCE" "AppDir/usr/share/icons/hicolor/256x256/apps/orvia.png"
          
          ARCH=x86_64 ./appimagetool AppDir Orvia_linux_${VERSION}.AppImage

      - name: 📦 Create DEB package
        run: |
          mkdir -p deb/DEBIAN
          mkdir -p deb/opt/orvia
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps
          
          cp -r build/linux/x64/release/bundle/* deb/opt/orvia/
          
          mkdir -p deb/usr/bin
          ln -s /opt/orvia/kelivo deb/usr/bin/kelivo
          
          cat > deb/DEBIAN/control << EOF
          Package: orvia
          Version: ${VERSION_NUMBER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Orvia <orvia@example.com>
          Depends: libgtk-3-0, libstdc++6, libglu1-mesa, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, libglib2.0-0, libc6
          Description: Orvia Application
           A Flutter application for Linux
          EOF
          
          cat > deb/usr/share/applications/orvia.desktop << EOF
          [Desktop Entry]
          Name=Orvia
          Exec=/opt/orvia/kelivo
          Icon=orvia
          Type=Application
          Categories=Utility;
          EOF

          ICON_SOURCE="linux/orvia.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          install -Dm644 "$ICON_SOURCE" deb/usr/share/icons/hicolor/256x256/apps/orvia.png
          
          cat > deb/opt/orvia/kelivo.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./kelivo "$@"
          EOF
          chmod +x deb/opt/orvia/kelivo.sh
          
          dpkg-deb --build deb Orvia_linux_${VERSION}_amd64.deb
      - name: 📦 Create RPM package
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          mkdir -p orvia-${VERSION_NUMBER}
          cp -r build/linux/x64/release/bundle/* orvia-${VERSION_NUMBER}/
          ICON_SOURCE="linux/orvia.png"
          if [ ! -f "$ICON_SOURCE" ]; then
            ICON_SOURCE="assets/app_icon.png"
          fi
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "❌ Icon source not found"
            exit 1
          fi
          cp "$ICON_SOURCE" orvia-${VERSION_NUMBER}/orvia.png
          tar -czf ~/rpmbuild/SOURCES/orvia-${VERSION_NUMBER}.tar.gz orvia-${VERSION_NUMBER}
          
          cat > ~/rpmbuild/SPECS/orvia.spec << EOF
          Name:           orvia
          Version:        ${VERSION_NUMBER}
          Release:        1%{?dist}
          Summary:        Orvia Application
          License:        MIT
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      x86_64
          Requires:       gtk3, libstdc++ >= 6, mesa-libGLU, gstreamer1, gstreamer1-plugins-base1.0-0, glib2, glibc
          
          %description
          A Flutter application for Linux
          
          %prep
          %setup -q
          
          %install
          mkdir -p %{buildroot}/opt/orvia
          cp -r * %{buildroot}/opt/orvia/
          
          mkdir -p %{buildroot}/usr/bin
          ln -s /opt/orvia/kelivo %{buildroot}/usr/bin/kelivo
          
          mkdir -p %{buildroot}/usr/share/applications
          cat > %{buildroot}/usr/share/applications/orvia.desktop << 'DESKTOPEOF'
          [Desktop Entry]
          Name=Orvia
          Exec=/opt/orvia/kelivo
          Icon=orvia
          Type=Application
          Categories=Utility;
          DESKTOPEOF

          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp orvia.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/orvia.png
          
          %files
          /opt/orvia/*
          /usr/bin/kelivo
          /usr/share/applications/orvia.desktop
          /usr/share/icons/hicolor/256x256/apps/orvia.png
          
          %changelog
          * $(date "+%a %b %d %Y") Orvia <orvia@example.com> - ${VERSION_NUMBER}-1
          - Initial RPM release
          EOF
          
          rpmbuild -bb ~/rpmbuild/SPECS/orvia.spec
          cp ~/rpmbuild/RPMS/x86_64/orvia-${VERSION_NUMBER}-1.*.rpm Orvia_linux_${VERSION}.rpm
      - name: 🔍 RPM metadata (debug)
        shell: bash
        run: |
          set -euxo pipefail
          RPM_FILE="Orvia_linux_${VERSION}.rpm"
          echo "RPM file: ${RPM_FILE}"
          cp -f ~/rpmbuild/SPECS/orvia.spec rpm-spec.spec
          rpm -qp --info "${RPM_FILE}" | tee rpm-info.txt
          rpm -qp --requires "${RPM_FILE}" | tee rpm-requires.txt
          rpm -qp --provides "${RPM_FILE}" | tee rpm-provides.txt
      - name: 📤 Upload RPM metadata (debug)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-RPM-Metadata
          path: |
            rpm-spec.spec
            rpm-info.txt
            rpm-requires.txt
            rpm-provides.txt
      - name: 🧪 Fedora 43 install test
        shell: bash
        run: |
          set -euxo pipefail
          RPM_FILE="Orvia_linux_${VERSION}.rpm"
          docker run --rm -v "${PWD}:/work" -w /work fedora:43 bash -lc "dnf -y install ./${RPM_FILE}"
      - name: 🚀 Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            Orvia_linux_*.tar.gz
            Orvia_linux_*.AppImage
            Orvia_linux_*_amd64.deb
            Orvia_linux_*.rpm
      - name: 📤 Upload build artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-tar.gz
          path: Orvia_linux_*.tar.gz

      - name: 📤 Upload build artifact (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-AppImage
          path: Orvia_linux_*.AppImage

      - name: 📤 Upload build artifact (DEB)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-DEB
          path: Orvia_linux_*_amd64.deb

      - name: 📤 Upload build artifact (RPM)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-RPM
          path: Orvia_linux_*.rpm
