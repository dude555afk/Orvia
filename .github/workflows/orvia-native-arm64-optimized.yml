name: Orvia Native ARM64 Optimized APK

on:
  push:
    branches:
      - feature/orvia-native-v2-isolated-20261015
    paths:
      - .github/workflows/orvia-native-arm64-optimized.yml
      - native-v2/patches/apply_orvia_feature_overlay.py
      - native-v2/patches/apply_orvia_email_overlay.py
      - native-v2/patches/native-src/**
      - docs/orvia-logo.png
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout Orvia and pinned LastChat
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-v2/lastchat/web-ui/package-lock.json
      - name: Use preinstalled Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Prepare ARM64-only, shrunk, Orvia-branded preview
        working-directory: native-v2/lastchat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle_path = Path("app/build.gradle.kts")
          data = gradle_path.read_text()
          changes = {
              'applicationId = "lastchat.rikkafork.cocolal"': 'applicationId = "com.dude555afk.orvia.nativev2"',
              'abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")': 'abiFilters += listOf("arm64-v8a")',
              'versionCode = 41': 'versionCode = 43',
          }
          for old, new in changes.items():
              assert old in data, f"Expected upstream source not found: {old.strip()}"
              data = data.replace(old, new, 1)
          gradle_path.write_text(data)
          manifest_path = Path("app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text()
          for old, new in {
              'android:label="@string/app_name"': 'android:label="Orvia Native Preview"',
              'android:icon="@mipmap/ic_launcher_lastchat"': 'android:icon="@drawable/orvia_logo"',
          }.items():
              assert old in manifest, old
              manifest = manifest.replace(old, new, 1)
          manifest_path.write_text(manifest)
          PY
          mkdir -p app/src/main/res/drawable-nodpi
          cp ../../docs/orvia-logo.png app/src/main/res/drawable-nodpi/orvia_logo.png

          # Keep Firebase SDK initialization valid in this isolated preview even
          # though no production Firebase project credentials are available.
          # Remote Config network fetches are expected to fail harmlessly.
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "orvia-native-preview",
              "storage_bucket": "orvia-native-preview.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "com.dude555afk.orvia.nativev2.dev"
                  }
                },
                "api_key": [
                  { "current_key": "AIzaSyDUMMY_PREVIEW_ONLY_NO_REAL_FIREBASE_KEY" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Remove high-risk unused capabilities from UI-only preview
        working-directory: native-v2/lastchat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          path = Path("app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          tree = ET.parse(path)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          assert app is not None

          # The upstream notification listener can read the user's
          # notifications after it is enabled. The UI preview does not
          # implement/test that capability and must not declare it.
          removed = 0
          for service in list(app.findall("service")):
              if service.get(android_ns + "permission") == "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE":
                  app.remove(service)
                  removed += 1
          assert removed == 1, f"Expected one notification listener, removed {removed}"

          # This preview is installed manually and does not need the ability
          # to install other APKs. Keep its permissions least-privilege.
          for permission in list(root.findall("uses-permission")):
              if permission.get(android_ns + "name") == "android.permission.REQUEST_INSTALL_PACKAGES":
                  root.remove(permission)
          tree.write(path, encoding="unicode", xml_declaration=True)
          print("Removed notification listener and APK installer permission")
          PY
      # Rebuild after Kilo onboarding, Orvia rebranding, and model-preset cleanup.
      - name: Apply Orvia native feature overlay
        run: python3 native-v2/patches/apply_orvia_feature_overlay.py

      - name: Run Edge TTS token compatibility test
        working-directory: native-v2/lastchat
        run: ./gradlew :tts:testDebugUnitTest --no-daemon --stacktrace

      - name: Install web UI dependencies
        working-directory: native-v2/lastchat/web-ui
        run: npm ci
      - name: Build x86_64 smoke-test APK with release shrinking
        working-directory: native-v2/lastchat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          data = p.read_text()
          old = 'abiFilters += listOf("arm64-v8a")'
          assert old in data, "Expected ARM64 ABI filter not found"
          p.write_text(data.replace(old, 'abiFilters += listOf("x86_64")', 1))
          PY
          ./gradlew :app:assembleDevRelease --no-daemon --stacktrace -Plastchat.abi.splits=false -Plastchat.release.minify=true
          APK="$(find app/build/outputs/apk/dev/release -name '*.apk' -type f -print -quit)"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/orvia-native-smoke.apk"
          python3 - <<'PY'
          from zipfile import ZipFile
          p = __import__("pathlib").Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "orvia-native-smoke.apk"
          with ZipFile(p) as z:
              abis = {n.split("/")[1] for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")}
              assert abis == {"x86_64"}, f"Smoke APK must contain x86_64 only, found {abis}"
          print("Prepared x86_64 release APK for emulator launch test")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          data = p.read_text()
          old = 'abiFilters += listOf("x86_64")'
          assert old in data, "Expected temporary x86_64 ABI filter not found"
          p.write_text(data.replace(old, 'abiFilters += listOf("arm64-v8a")', 1))
          PY
          rm -rf app/build/outputs/apk/dev/release
      - name: Upload x86_64 smoke APK for independent launch test
        uses: actions/upload-artifact@v4
        with:
          name: orvia-native-smoke-apk
          path: orvia-native-smoke.apk
          if-no-files-found: error
      - name: Build optimized ARM64 development release
        working-directory: native-v2/lastchat
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevRelease --no-daemon --stacktrace -Plastchat.abi.splits=false -Plastchat.release.minify=true
      - name: Verify ABI, APK integrity, and size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk_files = list(Path("native-v2/lastchat/app/build/outputs/apk/dev/release").glob("*.apk"))
          assert len(apk_files) == 1, f"Expected one APK, found {apk_files}"
          apk = apk_files[0]
          with ZipFile(apk) as f:
              assert f.testzip() is None, "Corrupt APK archive"
              names = f.namelist()
              abis = {name.split("/")[1] for name in names if name.startswith("lib/") and name.endswith(".so")}
              assert abis == {"arm64-v8a"}, f"Unexpected native architectures: {abis}"
              assert "classes.dex" in names
          size_mib = apk.stat().st_size / (1024*1024)
          print(f"APK {apk.name}: {size_mib:.2f} MiB. ABIs: {abis}")
          # Avoid publishing another giant binary as a purported size optimization.
          assert size_mib < 160, f"Optimized APK still too big ({size_mib:.2f} MiB)"
          PY
      - name: Audit FINAL packaged Android permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find native-v2/lastchat/app/build/outputs/apk/dev/release -name '*.apk' -type f -print -quit)"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/orvia-native-manifest.txt
          if grep -E 'android.permission.(BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE|READ_SMS|RECEIVE_SMS|REQUEST_INSTALL_PACKAGES)|android.service.notification.NotificationListenerService' /tmp/orvia-native-manifest.txt; then
            echo "Sensitive capability unexpectedly present in packaged APK"
            exit 1
          fi
          echo "PASS: no notification listener, accessibility binding, SMS interception, or APK installer permission"
      - name: Upload optimized ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: orvia-v2-native-arm64-optimized
          path: native-v2/lastchat/app/build/outputs/apk/dev/release/*.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download x86_64 smoke APK
        uses: actions/download-artifact@v4
        with:
          name: orvia-native-smoke-apk
          path: ${{ github.workspace }}
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner; hardware-accelerated emulator smoke tests cannot run."
            exit 1
          fi
      - name: Launch preview on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          # The action invokes script lines separately with /bin/sh. Keep all shell
          # control flow inside one bash -lc command so loops/conditionals stay intact.
          script: |
            bash -lc 'set -eu; PACKAGE="com.dude555afk.orvia.nativev2.dev"; adb start-server; adb wait-for-device; adb devices -l; adb logcat -c; adb install -r "$GITHUB_WORKSPACE/orvia-native-smoke.apk"; adb shell am force-stop "$PACKAGE"; adb shell am start -W -n "$PACKAGE/me.rerere.rikkahub.RouteActivity"; sleep 12; if ! adb shell pidof "$PACKAGE" >/dev/null; then echo "App process exited after launch; recent Android runtime logs:"; adb logcat -d -t 4000 -s AndroidRuntime:E System.err:E; exit 1; fi; if adb logcat -d -t 4000 -s AndroidRuntime:E | grep -E "FATAL EXCEPTION|Fatal signal"; then echo "Crash detected after launching preview"; exit 1; fi; echo "PASS: Orvia/LastChat preview process remained alive after startup"'
