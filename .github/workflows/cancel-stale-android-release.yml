name: Cancel stale Android release run
on:
  push:
    branches:
      - ops/cancel-stale-android-release-20261015
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete release initiated before version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/cancel-result -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dude555afk/Orvia/actions/runs/38682956220/cancel")"
          if [[ "$status" != 202 && "$status" != 409 ]]; then
            cat /tmp/cancel-result
            exit 1
          fi
          echo "Cancel response $status"
