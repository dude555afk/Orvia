name: Fix stale English-only tests

on:
  push:
    branches:
      - fix/complete-orvia-bootstrap

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/complete-orvia-bootstrap
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Fetch main
        run: git fetch origin main
      - name: Translate stale tests
        run: python3 .github/scripts/translate_stale_tests.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No stale test translations left."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test
          git commit -m "test: align stale expectations with English-only UI"
          git push origin HEAD:fix/complete-orvia-bootstrap
