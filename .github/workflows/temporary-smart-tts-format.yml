name: Temporary smart TTS formatter

on:
  push:
    branches: [fix/smart-tts-cleanup-20261013]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - name: Format TTS files and commit
        run: |
          set -euo pipefail
          dart format lib/core/services/tts/tts_speech_text_cleaner.dart test/core/services/tts/tts_speech_text_cleaner_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/tts/tts_speech_text_cleaner.dart test/core/services/tts/tts_speech_text_cleaner_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(tts): apply exact Dart formatter output"
            git push origin HEAD:fix/smart-tts-cleanup-20261013
          fi
